<!DOCTYPE html>
<html lang="es" data-tema="oscuro" data-fuente="serif">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dioses Modernos — La Paga del Pecado es Muerte</title>
<meta name="description" content="Novela de fantasía oscura publicada por entregas, de Luis Tangarife.">
<meta property="og:title" content="Dioses Modernos — La Paga del Pecado es Muerte">
<meta property="og:description" content="Novela de fantasía oscura publicada por entregas.">
<meta property="og:type" content="book">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --fondo:#121212; --texto:#d9d9d9; --tenue:#8a8a8a; --linea:#2a2a2a; --panel:#1c1c1c;
    --serif:"EB Garamond",Georgia,serif; --fuente:var(--serif); --tam:1.2rem;
  }
  :root[data-tema="claro"]{--fondo:#ffffff;--texto:#1a1a1a;--tenue:#6b6b6b;--linea:#e3e3e3;--panel:#f6f6f6}
  :root[data-tema="sepia"]{--fondo:#f4ecd8;--texto:#433422;--tenue:#7a6a55;--linea:#dccfb2;--panel:#ebe1c8}
  :root[data-fuente="sans"]{--fuente:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--fondo);color:var(--texto);font-family:var(--serif);font-size:1.1rem;line-height:1.6;
    -webkit-text-size-adjust:100%;min-height:100vh;display:flex;flex-direction:column
  }
  a{color:inherit}
  button{font:inherit}
  :focus-visible{outline:2px solid var(--texto);outline-offset:3px}
  .oculto{display:none!important}
  h1,h2{font-weight:400;line-height:1.15;margin:0}
  .barra{position:fixed;top:0;left:0;height:2px;width:0;background:var(--texto);z-index:50}

  /* Portada tipo libro */
  .portada{max-width:36rem;margin:0 auto;padding:4rem 1.4rem 3rem;text-align:center;width:100%}
  .libro{
    width:min(15rem,64vw);aspect-ratio:2/3;margin:0 auto;padding:2rem 1.4rem;
    display:flex;flex-direction:column;justify-content:space-between;align-items:center;
    background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,0) 7%),#1b1b1b;color:#ececec;
    border:1px solid #333;border-radius:.2rem .5rem .5rem .2rem;box-shadow:0 14px 34px rgba(0,0,0,.35);
    font-family:var(--serif)
  }
  .libro-titulo{font-size:2.3rem;line-height:1.02;margin-top:1rem}
  .libro-sub{font-style:italic;font-size:.98rem;color:#b5b5b5;line-height:1.3}
  .libro-autor{font-size:.95rem;color:#cfcfcf}
  .ficha h1{font-size:1.5rem;margin-top:2rem}
  .ficha p{margin:.3rem 0 0;color:var(--tenue)}
  .sinopsis{font-style:italic;margin:1.8rem auto 0;max-width:27rem}
  .boton{
    display:inline-block;margin-top:2rem;padding:.8rem 2.2rem;background:var(--texto);color:var(--fondo);
    text-decoration:none;border-radius:2rem;font-size:1.05rem
  }
  .boton:hover{opacity:.85}
  .contenido{max-width:36rem;margin:0 auto;width:100%;padding:1rem 1.4rem 4rem}
  .contenido h2.seccion{font-size:1.3rem;font-style:italic;color:var(--tenue);padding-bottom:.8rem;border-bottom:1px solid var(--linea)}
  .lista{list-style:none;padding:0;margin:0}
  .lista li{border-bottom:1px solid var(--linea)}
  .lista a,.lista .cerrado{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 0;text-decoration:none}
  .lista a:hover h2{text-decoration:underline;text-underline-offset:.25em;text-decoration-thickness:1px}
  .lista h2{font-size:1.3rem}
  .lista .num{color:var(--tenue);font-style:italic;font-size:.95rem;display:block;margin-bottom:.1rem}
  .lista .estado{color:var(--tenue);font-size:.95rem;white-space:nowrap}
  .lista .cerrado{opacity:.5}
  footer{margin-top:auto;text-align:center;color:var(--tenue);font-size:.9rem;padding:1.6rem 1.2rem}

  /* Barras del lector */
  .top,.pie{
    position:fixed;left:0;right:0;z-index:20;background:var(--fondo);display:none;align-items:center;
    justify-content:space-between;gap:1rem;padding:.6rem 1.1rem;transition:transform .25s,opacity .25s
  }
  .top{top:0;border-bottom:1px solid var(--linea)}
  .pie{bottom:0;border-top:1px solid var(--linea);color:var(--tenue);font-size:.95rem;padding-bottom:calc(.6rem + env(safe-area-inset-bottom,0px))}
  body.leyendo .top,body.leyendo .pie{display:flex}
  body.sin-chrome .top{transform:translateY(-100%);opacity:0}
  body.sin-chrome .pie{transform:translateY(100%);opacity:0}
  .top a,.top button{color:var(--tenue);background:none;border:0;cursor:pointer;text-decoration:none;font-size:1rem;padding:.4rem .2rem}
  .top a:hover,.top button:hover{color:var(--texto)}
  .top .libro-nom{color:var(--tenue);font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .aa{font-family:var(--serif);font-size:1.25rem}

  /* Lectura */
  .lectura{max-width:34rem;margin:0 auto;padding:6.5rem 1.5rem 7rem;width:100%}
  .cap-cab{text-align:center;margin:0 0 3rem}
  .cap-cab .num{color:var(--tenue);font-style:italic;font-size:1.05rem}
  .cap-cab h2{font-size:clamp(2rem,8vw,2.7rem);margin-top:.4rem}
  .cap-cab .meta{color:var(--tenue);font-size:.95rem;margin-top:.8rem}
  .texto{font-family:var(--fuente);font-size:var(--tam);line-height:1.7}
  .texto p{margin:0;text-indent:1.4em;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
  .texto p:first-child,.texto .escena+p{text-indent:0}
  .texto .escena{text-indent:0;text-align:center;color:var(--tenue);letter-spacing:.5em;margin:1.6em 0}
  .nav{display:flex;justify-content:space-between;align-items:center;gap:.8rem;margin-top:3.5rem;padding-top:1.6rem;border-top:1px solid var(--linea)}
  .nav a{text-decoration:none;font-size:1rem;border:1px solid var(--linea);border-radius:2rem;padding:.6rem 1.1rem}
  .nav a:hover{border-color:var(--texto)}
  .nav span{color:var(--tenue);font-size:1rem}

  /* Ajustes */
  .velo{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
  .hoja{
    position:fixed;left:0;right:0;bottom:0;max-width:34rem;margin:0 auto;z-index:40;background:var(--panel);
    border:1px solid var(--linea);border-bottom:0;border-radius:.9rem .9rem 0 0;padding:1.3rem 1.4rem calc(1.6rem + env(safe-area-inset-bottom,0px));
    display:grid;gap:1.1rem
  }
  .hoja .fila{display:flex;align-items:center;gap:.6rem}
  .hoja .fila button{
    flex:1;color:var(--texto);background:transparent;border:1px solid var(--linea);border-radius:.5rem;padding:.65rem;cursor:pointer
  }
  .hoja .fila button[aria-pressed="true"]{outline:2px solid var(--texto);outline-offset:1px}
  .hoja .t-claro{background:#fff!important;color:#1a1a1a!important}
  .hoja .t-sepia{background:#f4ecd8!important;color:#433422!important}
  .hoja .t-oscuro{background:#121212!important;color:#d9d9d9!important}
  .hoja .f-sans{font-family:system-ui,sans-serif}
  .hoja input[type=range]{flex:1;accent-color:var(--texto)}
</style>
</head>
<body>
<div class="barra" id="barra"></div>

<header class="top">
  <a id="inicio" href="#">‹ Índice</a>
  <span class="libro-nom">Dioses Modernos</span>
  <button class="aa" id="ajustes" aria-label="Ajustes de lectura">Aa</button>
</header>

<main>
  <!-- PORTADA -->
  <section id="vista-inicio">
    <div class="portada">
      <div class="libro" aria-hidden="true">
        <span class="libro-titulo">Dioses<br>Modernos</span>
        <span class="libro-sub">La Paga del Pecado es Muerte</span>
        <span class="libro-autor">Luis Tangarife</span>
      </div>
      <div class="ficha">
        <h1>Dioses Modernos</h1>
        <p>Luis Tangarife</p>
        <p>Novela de fantasía oscura, publicada por entregas</p>
      </div>
      <p class="sinopsis" id="sinopsis"></p>
      <a class="boton" id="continuar" href="#prologo">Empezar a leer</a>
    </div>
    <div class="contenido">
      <h2 class="seccion">Contenido</h2>
      <ul class="lista" id="lista"></ul>
    </div>
    <footer>© 2026 Luis Tangarife. Todos los derechos reservados.</footer>
  </section>

  <!-- LECTURA -->
  <article id="vista-lectura" class="lectura oculto">
    <header class="cap-cab">
      <div class="num" id="cap-num"></div>
      <h2 id="cap-titulo"></h2>
      <div class="meta" id="cap-meta"></div>
    </header>
    <div class="texto" id="cap-texto"></div>
    <nav class="nav" id="cap-nav"></nav>
  </article>
</main>

<div class="pie"><span id="pie-cap"></span><span id="pie-pct">0 %</span></div>

<div class="velo oculto" id="velo"></div>
<div class="hoja oculto" id="hoja" role="dialog" aria-label="Ajustes de lectura">
  <div class="fila">
    <button class="t-claro" data-t="claro">Blanco</button>
    <button class="t-sepia" data-t="sepia">Sepia</button>
    <button class="t-oscuro" data-t="oscuro">Oscuro</button>
  </div>
  <div class="fila"><span style="font-size:.9rem">A</span><input type="range" id="tam" min="1" max="1.7" step="0.05" aria-label="Tamaño de letra"><span style="font-size:1.4rem">A</span></div>
  <div class="fila">
    <button data-f="serif" style="font-family:var(--serif)">Con serifa</button>
    <button data-f="sans" class="f-sans">Sin serifa</button>
  </div>
</div>

<script>
/* =====================================================
   AQUÍ EDITAS TU CONTENIDO
   - Cada entrada es un bloque { titulo, publicado, texto }.
   - Deja una línea en blanco entre párrafos.
   - Escribe *** en una línea sola para un cambio de escena.
   - Cuando un capítulo esté listo, pon publicado: true.
   - El prólogo no cuenta como capítulo: los capítulos se numeran solos.
   ===================================================== */
const SINOPSIS = "Toda puerta conduce a una verdad, y las más antiguas nunca fueron ocultadas por estar equivocadas.";

const capitulos = [
  {
    id: "prologo",
    sinNumero: true,
    titulo: "Prólogo",
    publicado: true,
    texto: `Cualquiera que empiece a leer este libro podría pensar que se trata de guerras entre dioses, fantasías épicas, seres sobrenaturales y tramas mejoradas respecto a lo que ya se ha contado antes. Y tal vez lo sea, pero tal vez no.

La verdad es que yo, quien escribe estas líneas, no sabe realmente de qué trata esta historia. Todo parece girar sin aviso, como un péndulo que no encuentra su centro. A cada página creo entender su propósito... hasta que todo se desvanece en sombras más densas. ¿Me equivoco? ¿O simplemente soy otro iluso que se aferra a lo poco que cree saber?

No soy un escritor. Ni un héroe. Ni un narrador confiable.

Solo soy un sobreviviente.

Alguien que escribe para no desaparecer. Que se aferra a las palabras como si fueran cuchillas o refugio. ¿Es egoísta soñar con dejar una huella? ¿Es necio pensar que hay sentido en este caos?

Mírate. ¿Realmente crees que esto lo escribes tú? Qué patético intento de control...

Sigue fingiendo que eres el autor. Mientras yo te observo desde las sombras. Esperando.

Quizá este no sea un libro. Quizá sea un espejo. Uno que deforma. Que grita. Uno que, página tras página, revelará no solo una historia, sino fragmentos del lector.

Fragmentos de ti.

Y de mí.

Así que dime: ¿estás listo para perderte entre los huecos de esta narrativa? ¿Para mirar hacia dentro y no saber quién está mirando de vuelta? ¿Estás dispuesto a cruzar la puerta, sabiendo que no todos regresan con la misma forma… ni con la misma alma?

Porque toda puerta conduce a una verdad, y las verdades más antiguas nunca fueron ocultadas por estar equivocadas, sino por ser demasiado peligrosas para quienes se atrevieran a contemplarlas. Esta es una de ellas, no habla de héroes, no habla de elegidos, ni pretende defender aquello en lo que has aprendido a creer. Habla de dioses y de un pecado tan antiguo que incluso los propios dioses aprendieron a temer su nombre.

***

Todo el mundo cree que el mayor pecado fue desafiar a Dios. Se equivocan, el verdadero pecado fue descubrir que nunca hubo uno solo.

Desde tiempos inmemoriales —grabados como heridas en el pergamino del universo—, los hombres han erguido altares, han doblado rodillas, han pronunciado nombres que ya no recuerdan. Y en cada uno de esos gestos, se ha abierto una grieta. Porque la devoción a lo que no comprendemos también es una forma de esclavitud.

Los antiguos textos, aquellos que solo se murmuran en lenguas muertas, afirman que adorar a más de un ser supremo fue, y sigue siendo, un pecado. Un acto condenado. Una afrenta a la ley sagrada. Tal como lo advierte cierto libro que muchos cargan pero pocos entienden:

"La paga del pecado es la muerte."

¿Estás de acuerdo? ¿O quizás eres un pecador?.

Depende de la historia que te hayan contado.

No respondas todavía

Ahora ven conmigo, voy a mostrarte por qué te hice esa pregunta. Porque mucho antes de que existieran templos, profetas o mandamientos, ya habían dioses... y ya existía el pecado.

En el rincón del ayer —donde las eras no son tiempo sino ceniza— reposan los fragmentos de lo que una vez fue divino. Los recuerdos de los dioses, o de aquello que alguna vez llamamos así. Seres supremos. Olvidados. Descompuestos en mito.

Pero ¿y si te dijera que lo mitológico fue real? ¿Y que, en las grietas de esta realidad, aún respira?. Puede sonar ilógico, absurdo incluso desquiciado, pero la locura, como la fe, es cuestión de perspectiva.

Esta historia no sigue las reglas que conoces. No obedece los mapas del héroe, ni la línea recta del bien y el mal. Porque aquí no hubo creación. Hubo conquista. La humanidad no fue hecha a imagen de los dioses. Fue encadenada por ellos, Lo curioso es que todavía les llaman salvadores.

Los humanos tenían el potencial de convertirse en algo más. Mucho más. Pero eso no convenía. Aún no revelaré todo: no sería justo, ni divertido.

No tengas prisa, llegaremos ahí; los dioses llevan milenios esperando, tú puedes esperar unas páginas. Prefiero llevarte lentamente, desnudarte de certezas, hasta que estés listo para ver.

Todo comenzó en el alba del tiempo. O, mejor dicho, en su sombra. En el lugar donde el "nada" se convertía en "todo" y el "todo" se disolvía en el abismo de lo que aún no era. La existencia misma yacía suspendida, flotando en un vacío que ni siquiera sabía que estaba solo.

Y entonces algo ardió. Una chispa. Un instante de furia cósmica que prendió la Llama de la Creación.

A eso lo llamaron Eón.

El primer aliento del caos. El Ígneo.

Aquello que era materia se volvió etéreo, lo invisible adoptó formas, y las formas reclamaron poder con la urgencia de algo que lleva demasiado tiempo esperando existir. Portales intercósmicos se desgarraron en la trama del universo, permitiendo que sustancias impensables cruzaran hacia nuevos planos.

Y entonces surgieron ellos. Los que tú conoces por nombres limitados: Deidades Supremas, Dioses, Humanos, Ángeles, Demonios, Bestias... y el Ígneo. Cada uno brotó de un plano único, teñido con su propia esencia, cargado de su propio horror.

Pero algunos no se conformaron con lo que eran. Querían más.

Todo.

Y así comenzó la ruptura. La traición. La guerra. Los Cielos se abrieron en fuego…

La Guerra Ígnea comenzó.

Y todos ellos —en busca del Ígneo— avanzaron. No para adorarlo, sino para devorarlo. Para alcanzar algo que solo puede describirse con un susurro:

el Nirvana.`
  },
  { titulo: "Título del capítulo uno",    publicado: false, texto: `` },
  { titulo: "Título del capítulo dos",    publicado: false, texto: `` },
  { titulo: "Título del capítulo tres",   publicado: false, texto: `` },
  { titulo: "Título del capítulo cuatro", publicado: false, texto: `` }
];

/* ================= A partir de aquí no hace falta tocar nada ================= */
const ROMANOS = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV","XVI","XVII","XVIII","XIX","XX"];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const minutos = c => Math.max(1, Math.round(c.texto.trim().split(/\s+/).length / 200));
const raiz = document.documentElement;
const guardar = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
const leer = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };

// Numera solo los capítulos (el prólogo queda aparte)
let n = 0;
capitulos.forEach(c => {
  if (c.sinNumero) { c.rotulo = ""; }
  else { n++; c.rotulo = "Capítulo " + (ROMANOS[n-1] || n); c.id = c.id || "cap-" + n; }
});

$("sinopsis").textContent = SINOPSIS;
$("lista").innerHTML = capitulos.map(c => {
  const num = c.rotulo ? `<span class="num">${c.rotulo}</span>` : "";
  const cuerpo = `<span>${num}<h2>${esc(c.titulo)}</h2></span>`;
  return c.publicado
    ? `<li><a href="#${c.id}">${cuerpo}<span class="estado">${minutos(c)} min</span></a></li>`
    : `<li><div class="cerrado">${cuerpo}<span class="estado">Próximamente</span></div></li>`;
}).join("");

// ---------- Ajustes de lectura (se recuerdan en el navegador del lector) ----------
function marcar(){
  document.querySelectorAll("#hoja button").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.t === raiz.dataset.tema || b.dataset.f === raiz.dataset.fuente));
  });
}
function ponerTema(t){ raiz.dataset.tema = t; guardar("dm-tema", t); marcar(); }
function ponerFuente(f){ raiz.dataset.fuente = f; guardar("dm-fuente", f); marcar(); }
function ponerTam(v){
  v = Math.min(1.7, Math.max(1, parseFloat(v) || 1.2));
  raiz.style.setProperty("--tam", v + "rem"); $("tam").value = v; guardar("dm-tam", v);
}
const tSaved = leer("dm-tema"), fSaved = leer("dm-fuente");
ponerTema(["claro","sepia","oscuro"].includes(tSaved) ? tSaved : "oscuro");
ponerFuente(fSaved === "sans" ? "sans" : "serif");
ponerTam(leer("dm-tam") || 1.2);
document.querySelectorAll("#hoja button").forEach(b => {
  b.onclick = () => b.dataset.t ? ponerTema(b.dataset.t) : ponerFuente(b.dataset.f);
});
$("tam").oninput = e => ponerTam(e.target.value);
const abrirHoja = v => { $("hoja").classList.toggle("oculto", !v); $("velo").classList.toggle("oculto", !v); };
$("ajustes").onclick = () => abrirHoja($("hoja").classList.contains("oculto"));
$("velo").onclick = () => abrirHoja(false);

// ---------- Lector ----------
const POS = "dm-pos";
let actualId = null, ultimoY = 0, timer;
const actual = () => capitulos.find(c => c.id === actualId);
const progreso = () => { const m = raiz.scrollHeight - raiz.clientHeight; return m > 0 ? Math.min(1, raiz.scrollTop / m) : 0; };
const chrome = v => document.body.classList.toggle("sin-chrome", !v);
function pintarProgreso(){
  const p = progreso();
  $("barra").style.width = (p * 100) + "%";
  $("pie-pct").textContent = Math.round(p * 100) + " %";
}
function posGuardada(){ try { return JSON.parse(leer(POS) || "null"); } catch(e){ return null; } }
function pintarContinuar(){
  const pos = posGuardada();
  const c = pos && capitulos.find(x => x.id === pos.id && x.publicado);
  const b = $("continuar");
  if (c && pos.r > 0.02) { b.textContent = "Continuar leyendo"; b.href = "#" + c.id; }
  else { const p = capitulos.find(x => x.publicado); b.textContent = "Empezar a leer"; b.href = "#" + (p ? p.id : ""); }
}
const arriba = y => window.scrollTo({ top: y, behavior: "instant" });

function mostrar(){
  const i = capitulos.findIndex(c => c.id === location.hash.slice(1));
  const cap = capitulos[i];
  const leyendo = !!cap && cap.publicado;

  document.body.classList.toggle("leyendo", leyendo);
  $("vista-inicio").classList.toggle("oculto", leyendo);
  $("vista-lectura").classList.toggle("oculto", !leyendo);
  abrirHoja(false); chrome(true); arriba(0); ultimoY = 0;
  $("barra").style.width = "0";

  if (!leyendo) {
    actualId = null; document.title = "Dioses Modernos — La Paga del Pecado es Muerte"; pintarContinuar(); return;
  }
  actualId = cap.id;
  document.title = cap.titulo + " · Dioses Modernos";
  $("cap-num").textContent = cap.rotulo;
  $("cap-num").classList.toggle("oculto", !cap.rotulo);
  $("cap-titulo").textContent = cap.titulo;
  $("cap-meta").textContent = minutos(cap) + " min de lectura";
  $("pie-cap").textContent = cap.rotulo || cap.titulo;
  $("cap-texto").innerHTML = cap.texto.trim().split(/\n\s*\n/).map(p =>
    p.trim() === "***" ? `<p class="escena">* * *</p>` : `<p>${esc(p.trim()).replace(/\n/g,"<br>")}</p>`
  ).join("");

  const ant = i > 0 && capitulos[i-1].publicado;
  const sig = i < capitulos.length - 1 && capitulos[i+1].publicado;
  $("cap-nav").innerHTML =
    (ant ? `<a href="#${capitulos[i-1].id}">← Anterior</a>` : `<span></span>`) +
    `<a href="#">Índice</a>` +
    (sig ? `<a href="#${capitulos[i+1].id}">Siguiente →</a>` : `<span>Próximamente</span>`);

  const pos = posGuardada();
  if (pos && pos.id === cap.id && pos.r > 0.01) {
    requestAnimationFrame(() => arriba(pos.r * (raiz.scrollHeight - raiz.clientHeight)));
  }
  pintarProgreso();
}
window.addEventListener("hashchange", mostrar);
mostrar();

// Al bajar se ocultan las barras, al subir reaparecen; tocar el texto también las alterna
window.addEventListener("scroll", () => {
  if (!actualId) return;
  const y = raiz.scrollTop;
  pintarProgreso();
  if (Math.abs(y - ultimoY) > 10) { chrome(y < ultimoY || y < 80); ultimoY = y; }
  clearTimeout(timer);
  timer = setTimeout(() => guardar(POS, JSON.stringify({ id: actualId, r: progreso() })), 400);
}, { passive: true });
$("cap-texto").addEventListener("click", () => {
  if (String(window.getSelection()).length) return;
  chrome(document.body.classList.contains("sin-chrome"));
});
</script>
